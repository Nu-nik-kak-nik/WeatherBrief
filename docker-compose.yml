version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./weather.db:/app/weather.db
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - ENV_FILE=/app/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
        - VITE_FRONTEND_OAUTH_CALLBACK_URL=${VITE_FRONTEND_OAUTH_CALLBACK_URL:-http://localhost:5173/oauth/callback}
    ports:
      - "5173:80"   # порт фронтенда на хосте, можно изменить
    restart: unless-stopped

volumes:
  redis_data:
